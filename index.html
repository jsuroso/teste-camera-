<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Teste de Câmera</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      text-align: center;
      background: #1c1c1c;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }

    h1 {
      margin-top: 0;
    }

    p {
      color: #bbb;
      line-height: 1.5;
    }

    video {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 15px;
      background: #000;
      display: none;
      transform: scaleX(-1);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #start {
      background: #fff;
      color: #111;
    }

    #stop {
      background: #333;
      color: white;
      display: none;
    }

    #status {
      margin-top: 15px;
      font-size: 14px;
    }

    .online {
      color: #4ade80;
    }

    .error {
      color: #ff6b6b;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>📷 Teste de câmera</h1>

    <p>
      Este teste solicitará acesso à câmera frontal do seu dispositivo.
      A câmera só será ativada depois que você autorizar.
    </p>

    <video id="camera" autoplay playsinline></video>

    <button id="start">
      Ativar câmera
    </button>

    <button id="stop">
      Desligar câmera
    </button>

    <div id="status">
      Câmera desligada
    </div>
  </div>

  <script>
    const video = document.getElementById("camera");
    const start = document.getElementById("start");
    const stop = document.getElementById("stop");
    const status = document.getElementById("status");

    let stream = null;

    start.addEventListener("click", async () => {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("Seu navegador não permite acesso à câmera.");
        }

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: "user"
            }
          },
          audio: false
        });

        video.srcObject = stream;
        video.style.display = "block";

        start.style.display = "none";
        stop.style.display = "block";

        status.textContent = "🟢 Câmera ativa";
        status.className = "online";

      } catch (error) {
        console.error(error);

        status.textContent =
          "❌ Não foi possível acessar a câmera: " + error.message;

        status.className = "error";
      }
    });

    stop.addEventListener("click", () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
      video.style.display = "none";

      start.style.display = "block";
      stop.style.display = "none";

      status.textContent = "Câmera desligada";
      status.className = "";
    });

    window.addEventListener("beforeunload", () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    });
  </script>

</body>
</html>
